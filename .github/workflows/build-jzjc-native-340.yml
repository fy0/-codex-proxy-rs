name: Build lightweight JZJC for CPR 3.40.0 (Linux ARM64)

on:
  push:
    branches: [build/cpr-jzjc-native-340]
    paths:
      - '.github/workflows/build-jzjc-native-340.yml'
      - '.github/jzjc-native/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Native Rust scorer / aarch64 / CPR 3.40.0
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    env:
      TARGET: aarch64-unknown-linux-gnu
      CARGO_BUILD_JOBS: 4
      RUSTFLAGS: -C debuginfo=0
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Confirm native ARM64 build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libssl-dev file binutils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: aarch64-unknown-linux-gnu
          components: rustfmt
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Checkout exact JZJC upstream source and apply versioned native overrides
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v1.14.0 https://github.com/Victor-Tau/cpr-jzjc.git jzjc
          test "$(git -C jzjc rev-parse HEAD)" = a8a490fcfc2715ba59435d679907a8ee0e0941f9
          python .github/jzjc-native/apply.py jzjc
          git -C jzjc diff --check
          echo "CPR 3.40.0 native Rust overrides applied"
      - name: Build JZJC management UI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g pnpm@10.14.0
          pnpm --dir jzjc/frontend install --frozen-lockfile
          pnpm --dir jzjc/frontend build
      - name: Create Python/NumPy parity fixture (GitHub CI ONLY, not shipped)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --only-binary=:all: numpy==2.4.3
          python .github/jzjc-native/generate-fixture.py jzjc "$GITHUB_WORKSPACE/parity.json"
          echo "CPR_PARITY_FIXTURE=$GITHUB_WORKSPACE/parity.json" >> "$GITHUB_ENV"
      - name: Check native Rust formatting, numerical parity and existing tests
        shell: bash
        run: |
          set -euo pipefail
          (
            cargo +1.99.1 fmt --manifest-path jzjc/backend/Cargo.toml --all
            cargo +1.99.1 fmt --manifest-path jzjc/backend/Cargo.toml --all -- --check
            cargo +1.99.1 test --manifest-path jzjc/backend/Cargo.toml
          ) 2>&1 | tee "$GITHUB_WORKSPACE/native-tests.log"
      - name: Build release binary on native Linux ARM64
        shell: bash
        run: |
          set -euo pipefail
          (
            cargo +1.99.1 build --manifest-path jzjc/backend/Cargo.toml \
              --release --locked --target "$TARGET"
            file "jzjc/backend/target/$TARGET/release/modeltrace-health"
            readelf -h "jzjc/backend/target/$TARGET/release/modeltrace-health" | grep AArch64
          ) 2>&1 | tee "$GITHUB_WORKSPACE/native-build.log"
      - name: Build matching CPR 3.40.0 plugin packaging CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 install --locked \
            --git https://github.com/zyycn/codex-proxy-rs.git --tag v3.40.0 \
            codex-proxy-plugin-cli --root "$RUNNER_TEMP/cpr340-cli"
      - name: Package native ARM64 plugin without Python runtime resource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          (
            cd jzjc
            "$RUNNER_TEMP/cpr340-cli/bin/cpr-plugin" package --manifest plugin.json \
              --binary "backend/target/$TARGET/release/modeltrace-health" \
              --target "$TARGET" --resource-map web=frontend/dist \
              --output-dir "$GITHUB_WORKSPACE/dist"
            ls -lh "$GITHUB_WORKSPACE/dist"
          ) 2>&1 | tee "$GITHUB_WORKSPACE/native-package.log"
      - name: Verify 3.40 manifest/ELF/size and mock-host detection lifecycle
        shell: bash
        run: |
          set -euo pipefail
          (
            python .github/jzjc-native/verify-native.py \
              "$GITHUB_WORKSPACE/dist/personal.modeltrace-health-1.15.0-$TARGET.tar.gz" \
              "$GITHUB_WORKSPACE/jzjc"
          ) 2>&1 | tee "$GITHUB_WORKSPACE/native-verify.log"
      - name: Publish failure logs for troubleshooting
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=()
          for file in native-tests.log native-build.log native-package.log native-verify.log; do
            if [ -f "$file" ]; then files+=("$file"); fi
          done
          if [ "${#files[@]}" -gt 0 ]; then
            gh release create "cpr-jzjc-native-debug-${GITHUB_SHA:0:12}" "${files[@]}" \
              --title "JZJC 3.40.0 native ARM64 build diagnostics only" \
              --target "$GITHUB_SHA" \
              --notes "Diagnostic logs, not installable plugins" --prerelease
          fi
      - name: Upload validated lightweight installation package
        uses: actions/upload-artifact@v4
        with:
          name: cpr-jzjc-native-linux-arm64-340
          path: |
            dist/*.tar.gz
            dist/*.sha256
          retention-days: 30
          if-no-files-found: error
      - name: Publish final ARM64 installation archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='cpr-jzjc-native-arm64-v1.15.0-cpr3.40.0'
          printf 'JZJC v1.15.0 native Rust scorer for Codex Proxy RS 3.40.0.\nSource: Victor-Tau/cpr-jzjc v1.14.0 + audited Rust scoring overlays.\nPython and NumPy are used only for CI numerical parity verification; NOT included in plugin.\nAArch64/Linux, manifestVersion 2, protocolVersion 7.\n' > release-notes.txt
          gh release create "$tag" dist/* \
            --title 'JZJC v1.15.0 native ARM64 / CPR 3.40.0' \
            --notes-file release-notes.txt \
            --target "$GITHUB_SHA" --prerelease
