name: Verify image bridge quota isolation

on:
  push:
    branches:
      - fix/image-bridge-quota-isolation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
        with:
          repository: zyycn/codex-proxy-rs
          ref: 96e8443ede051abdd8f0bac69462a7cfe2945633
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: image-bridge-host-contract-96e8443
      - name: Verify real Core session behavior after plugin account filtering
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path backend/Cargo.toml \
            -p provider-openai --test main \
            provider::contract::session_binding::child_binding_respects_filtered_delegation_and_explicit_plugin_choices \
            -- --exact --nocapture 2>&1 | tee host-policy-test.log
          grep -q '1 passed' host-policy-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-host-policy-evidence
          path: host-policy-test.log
  plugin:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zyycn/codex-proxy-rs
          ref: 96e8443ede051abdd8f0bac69462a7cfe2945633
          path: host
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-image-bridge-v73
      - name: Check formatting and run plugin regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo generate-lockfile
          cargo test --locked 2>&1 | tee quota-isolation-test.log
      - name: Build and package plugin
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target '${{ matrix.target }}'
          cargo install --locked --path host/backend/apps/plugin-cli --root "${RUNNER_TEMP}/cpr-tools"
          "${RUNNER_TEMP}/cpr-tools/bin/cpr-plugin" package \
            --manifest plugin.json \
            --binary './target/${{ matrix.target }}/release/cpr-image-bridge' \
            --target '${{ matrix.target }}' \
            --resource-map web=web \
            --output-dir dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quota-isolation-${{ matrix.target }}
          path: |
            quota-isolation-test.log
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
