name: Reusable Container

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to build and validate
        required: true
        type: string

permissions:
  contents: read
  security-events: write
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CPR_IMAGE: codex-proxy-rs:ci-${{ inputs.ref }}
      # fork 仓库名可能不是合法镜像名（如前导 `-`），GHCR 名称固定用仓库 owner + 项目名。
      GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/codex-proxy-rs
      TRIVY_QUIET: 'true'
      TRIVY_SKIP_VERSION_CHECK: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Cache Cargo mounts
        id: cargo-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/container-cargo
          key: container-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Cargo.lock', 'backend/**/Cargo.toml', 'deploy/Dockerfile') }}-${{ inputs.ref }}
          restore-keys: |
            container-cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Cargo.lock', 'backend/**/Cargo.toml', 'deploy/Dockerfile') }}-
            container-cargo-v1-${{ runner.os }}-${{ runner.arch }}-

      # The GHA layer exporter does not persist RUN --mount=type=cache contents.
      # Extraction runs before actions/cache saves its directories in post steps.
      - name: Restore Cargo mounts to BuildKit
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          scratch-dir: ${{ runner.temp }}/container-cache-dance
          cache-map: |
            {
              "${{ runner.temp }}/container-cargo/registry": "/usr/local/cargo/registry",
              "${{ runner.temp }}/container-cargo/git": "/usr/local/cargo/git",
              "${{ runner.temp }}/container-cargo/target": "/app/backend/target"
            }
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}

      # PR 上 GITHUB_TOKEN 没有 packages:write，只在 push 到默认分支时推 GHCR。
      - name: Login to GHCR
        if: github.event_name == 'push'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          load: true
          tags: |
            ${{ env.CPR_IMAGE }}
            ${{ env.GHCR_IMAGE }}:sha-${{ inputs.ref }}
            ${{ env.GHCR_IMAGE }}:edge
          no-cache-filters: |
            runtime-base
            runtime
          cache-from: type=gha,scope=runtime-ci
          cache-to: type=gha,mode=max,scope=runtime-ci

      - name: Verify runtime image
        uses: ./.github/actions/verify-container
        with:
          image: ${{ env.CPR_IMAGE }}
          platform: linux/amd64
          artifact-name: container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-amd64

      - name: Push image to GHCR
        if: github.event_name == 'push'
        shell: bash
        run: |
          docker push "${GHCR_IMAGE}:sha-${{ inputs.ref }}"
          docker push "${GHCR_IMAGE}:edge"

      # 镜像 tar 无条件归档为制品，GHCR 推送失败时也有可用镜像。
      - name: Export image archive
        id: archive
        if: always()
        shell: bash
        run: |
          if docker image inspect "${CPR_IMAGE}" >/dev/null 2>&1; then
            docker save "${CPR_IMAGE}" | gzip > "${RUNNER_TEMP}/codex-proxy-rs-image.tar.gz"
            echo "saved=true" >> "$GITHUB_OUTPUT"
          else
            echo "saved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload image artifact
        if: always() && steps.archive.outputs.saved == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-image-${{ inputs.ref }}
          path: ${{ runner.temp }}/codex-proxy-rs-image.tar.gz
          if-no-files-found: error
          retention-days: 14
