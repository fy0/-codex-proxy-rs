name: Container

on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit SHA to build and validate
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  container:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    env:
      CPR_IMAGE: codex-proxy-rs:ci-${{ inputs.ref }}-${{ matrix.arch }}
      TRIVY_QUIET: 'true'
      TRIVY_SKIP_VERSION_CHECK: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore Cargo snapshot
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/container-cargo
          # 同一平台和依赖复用快照，源码变化由 Cargo 指纹判定是否重编译
          key: container-cargo-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/Cargo.lock', 'backend/rust-toolchain.toml', 'backend/**/Cargo.toml', 'backend/.cargo/config.toml', 'deploy/Dockerfile', '.github/actions/cargo-cache/Dockerfile') }}
          restore-keys: |
            container-cargo-v3-${{ runner.os }}-${{ runner.arch }}-
            container-cargo-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore Cargo mounts to BuildKit
        id: cargo-restore
        uses: ./.github/actions/cargo-cache
        with:
          operation: restore
          builder: ${{ steps.buildx.outputs.name }}
          path: ${{ runner.temp }}/container-cargo
          architecture: ${{ matrix.arch }}

      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.CPR_IMAGE }}
          build-args: |
            CPR_GIT_SHA=${{ inputs.ref }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.codex-proxy.migration.target=3.19.0
          no-cache-filters: |
            runtime-base
            runtime
          cache-from: |
            type=gha,scope=runtime-ci-${{ matrix.arch }}
            type=gha,scope=runtime-ci
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope=runtime-ci-{0}', matrix.arch) || '' }}

      - name: Verify runtime image
        uses: ./.github/actions/verify-container
        with:
          image: ${{ env.CPR_IMAGE }}
          platform: ${{ matrix.platform }}
          artifact-name: container-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}

      # 构建层命中时 mount 仍可能为空，只有实际检查过内容的快照才允许保存。
      - name: Export Cargo snapshot
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          (steps.cargo-cache.outputs.cache-hit != 'true' || steps.cargo-restore.outputs.usable != 'true')
        id: cargo-snapshot
        uses: ./.github/actions/cargo-cache
        with:
          operation: snapshot
          builder: ${{ steps.buildx.outputs.name }}
          path: ${{ runner.temp }}/container-cargo
          architecture: ${{ matrix.arch }}

      - name: Save Cargo snapshot
        if: steps.cargo-snapshot.outputs.usable == 'true' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/container-cargo
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      # 只传递已经通过迁移测试和运行时验证的镜像；发布任务不再重新构建。
      - name: Export verified edge image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'fy0/-codex-proxy-rs'
        shell: bash
        env:
          EXPECTED_REVISION: ${{ inputs.ref }}
          IMAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker image inspect "$CPR_IMAGE" | jq -e --arg revision "$EXPECTED_REVISION" --arg arch "$IMAGE_ARCH" '
            .[0] | .Architecture == $arch and
            .Config.Labels["org.opencontainers.image.revision"] == $revision and
            .Config.Entrypoint == ["python3", "/app/deploy/upstream-migration/migrate.py"]'
          docker run --rm --entrypoint python3 "$CPR_IMAGE" -c '
          import sys
          sys.path.insert(0, "/app/deploy/upstream-migration")
          import migrate
          assert migrate.load_bundle()["target_tag"] == "v3.19.0"
          assert (migrate.BASE / "tests-passed").is_file()
          '
          docker save "$CPR_IMAGE" | gzip -1 > "$RUNNER_TEMP/edge-image-${IMAGE_ARCH}.tar.gz"

      - name: Upload verified edge image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'fy0/-codex-proxy-rs'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edge-image-${{ inputs.ref }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/edge-image-${{ matrix.arch }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7
