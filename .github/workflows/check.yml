name: Build CPR image bridge plugin

on:
  push:
    branches:
      - builds/cpr-image-bridge-v0.7.4-official
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
      - name: Check out matching host SDK and packaging CLI
        uses: actions/checkout@v4
        with:
          repository: zyycn/codex-proxy-rs
          ref: 96e8443ede051abdd8f0bac69462a7cfe2945633
          path: host
      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-image-bridge-v73
      - name: Generate dependency lock
        run: cargo generate-lockfile
      - name: Test plugin
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee cargo-test.log
      - name: Upload diagnostic log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-log-${{ matrix.target }}
          path: cargo-test.log
          if-no-files-found: ignore
      - name: Publish failing test log for diagnostic review
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          test -f cargo-test.log || printf 'cargo test did not start\n' > cargo-test.log
          tail -n 300 cargo-test.log > "$RUNNER_TEMP/test-output.txt"
          git checkout --orphan 'logs/cpr-image-bridge-v0.7.4-official-${{ matrix.target }}'
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/test-output.txt" ./test-output.txt
          git add -- test-output.txt
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'ci: capture image bridge cargo failure'
          git push --force origin HEAD:refs/heads/logs/cpr-image-bridge-v0.7.4-official-${{ matrix.target }}
      - name: Build release executable
        run: cargo build --locked --release --target '${{ matrix.target }}'
      - name: Build official plugin packaging CLI
        run: cargo install --locked --path host/backend/apps/plugin-cli --root "${RUNNER_TEMP}/cpr-tools"
      - name: Package installable artifact
        run: |
          "${RUNNER_TEMP}/cpr-tools/bin/cpr-plugin" package \
            --manifest ./plugin.json \
            --binary "./target/${{ matrix.target }}/release/cpr-image-bridge" \
            --target '${{ matrix.target }}' \
            --resource-map web=web \
            --output-dir ./dist
          ls -lh ./dist
      - name: Publish CI build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpr-image-bridge-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  collect:
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download platform install bundles
        uses: actions/download-artifact@v4
        with:
          pattern: cpr-image-bridge-*
          path: dist
          merge-multiple: true
      - name: Verify packages and hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" = 3
          for checksum in dist/*.sha256; do
            ( cd dist && sha256sum -c "$(basename "$checksum")" )
          done
      - name: Commit packages to separate download branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-packages"
          cp dist/* "$RUNNER_TEMP/ci-packages/"
          git checkout --orphan compiled/cpr-image-bridge-v0.7.4-official
          git rm -rf . >/dev/null 2>&1 || true
          cp "$RUNNER_TEMP/ci-packages/"* .
          git add -- *.tar.gz *.sha256
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build: publish image bridge v0.7.4 packages'
          git push --force origin HEAD:refs/heads/compiled/cpr-image-bridge-v0.7.4-official
