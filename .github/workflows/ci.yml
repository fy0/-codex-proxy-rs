name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'release/version.yaml'
      - 'release/notes.md'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      container: ${{ steps.filter.outputs.container }}
      source: ${{ steps.filter.outputs.source }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Detect affected checks
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # 目录规则取并集，再统一排除说明文档，保留隐藏配置与子模块指针
          predicate-quantifier: some-with-excludes
          filters: |
            backend:
              - 'backend/**'
              - 'release/version.yaml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_quality.yml'
              - '!**/*.md'
            frontend:
              - 'frontend/**'
              - '.github/actions/build-frontend/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/_quality.yml'
              - '!**/*.md'
            source:
              - '.gitmodules'
              - 'modules/ui'
              - 'modules/plugins'
              - 'frontend/**'
              - 'backend/crates/gateway-plugin/sdk/**'
              - '.github/workflows/ci.yml'
              - '!**/*.md'
            container:
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'
              - '.dockerignore'
              - 'release/version.yaml'
              - '.github/actions/verify-container/**'
              - '.github/actions/cargo-cache/**'
              - '.github/workflows/_container.yml'
              - '.github/workflows/ci.yml'
              - '!**/*.md'

  quality:
    needs: changes
    uses: ./.github/workflows/_quality.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      run_backend: ${{ needs.changes.outputs.backend == 'true' }}
      run_frontend: ${{ needs.changes.outputs.frontend == 'true' }}

  container:
    needs: changes
    if: needs.changes.outputs.container == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_container.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

  source-development:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout with development modules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1a3a6d54512beeaffd394f8d516ca16f2c506a20 # 1.97
      - name: Check dependency pins
        run: |
          ui_revision="$(git -C modules/ui rev-parse HEAD)"
          for lockfile in frontend/pnpm-lock.yaml modules/plugins/examples/workbench/frontend/pnpm-lock.yaml; do
            locked_revision="$(sed -nE 's@.*codeload.github.com/zyycn/codex-proxy-ui/tar.gz/([a-f0-9]{40}).*@\1@p' "$lockfile" | sort -u)"
            if [ "$locked_revision" != "$ui_revision" ]; then
              echo "::error file=$lockfile::UI dependency must match modules/ui ($ui_revision)"
              exit 1
            fi
          done
      - name: Install development dependencies
        run: |
          pnpm --dir modules/ui install --frozen-lockfile
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir modules/plugins/examples/workbench/frontend install --frozen-lockfile
      - name: Check UI source integration
        run: |
          pnpm --dir frontend build:source
          pnpm --dir modules/plugins/examples/workbench/frontend build:source
      - name: Check local SDK integration
        env:
          RUST_MIN_STACK: 16777216
          CARGO_TARGET_DIR: ${{ github.workspace }}/backend/target/plugin-development
        run: |
          sdk_check_dir="$RUNNER_TEMP/plugin-source"
          mkdir -p "$sdk_check_dir/backend"
          cp modules/plugins/examples/workbench/backend/Cargo.{toml,lock} "$sdk_check_dir/backend/"
          cp -R modules/plugins/examples/workbench/backend/{src,tests} "$sdk_check_dir/backend/"
          cp modules/plugins/examples/workbench/plugin.json "$sdk_check_dir/"
          cargo test --manifest-path "$sdk_check_dir/backend/Cargo.toml" \
            --config "patch.\"https://github.com/zyycn/codex-proxy-rs.git\".gateway-plugin-sdk.path=\"$GITHUB_WORKSPACE/backend/crates/gateway-plugin/sdk\""
      - name: Ensure source checks preserve lockfiles
        run: |
          git diff --exit-code -- frontend/package.json frontend/pnpm-lock.yaml backend/Cargo.lock
          git -C modules/plugins diff --exit-code -- examples/workbench/frontend/package.json examples/workbench/frontend/pnpm-lock.yaml examples/workbench/backend/Cargo.lock

  # 写包权限仅授予最终发布任务；PR 和定时安全扫描不会更新 edge。
  publish-edge:
    needs: [container, quality, source-development]
    if: >-
      always() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'fy0/-codex-proxy-rs' &&
      needs.container.result == 'success' && needs.quality.result == 'success' &&
      (needs.source-development.result == 'success' || needs.source-development.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      GHCR_IMAGE: ghcr.io/fy0/codex-proxy-rs
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download verified images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: edge-image-${{ github.sha }}-*
          path: ${{ runner.temp }}/edge-images
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified multi-platform edge
        shell: bash
        run: |
          set -euo pipefail
          # 防止旧提交的重跑在新提交之后覆盖浮动标签。
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo '::notice::A newer main commit exists; edge publication skipped.'
            exit 0
          fi
          sources=()
          for arch in amd64 arm64; do
            gzip -dc "$RUNNER_TEMP/edge-images/edge-image-${arch}.tar.gz" | docker load
            local_image="codex-proxy-rs:ci-${GITHUB_SHA}-${arch}"
            docker image inspect "$local_image" | jq -e --arg revision "$GITHUB_SHA" --arg arch "$arch" '
              .[0] | .Architecture == $arch and
              .Config.Labels["org.opencontainers.image.revision"] == $revision and
              .Config.Entrypoint == ["python3", "/app/deploy/upstream-migration/migrate.py"]'
            remote_image="${GHCR_IMAGE}:sha-${GITHUB_SHA}-${arch}"
            docker tag "$local_image" "$remote_image"
            docker push "$remote_image"
            digest="$(docker image inspect "$remote_image" --format '{{range .RepoDigests}}{{println .}}{{end}}' |
              grep -F "${GHCR_IMAGE}@sha256:" | head -n 1)"
            test -n "$digest"
            sources+=("$digest")
          done
          docker buildx imagetools create -t "${GHCR_IMAGE}:sha-${GITHUB_SHA}" "${sources[@]}"
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo '::notice::A newer main commit exists; only the commit-specific image was published.'
            exit 0
          fi
          docker buildx imagetools create -t "${GHCR_IMAGE}:edge" "${GHCR_IMAGE}:sha-${GITHUB_SHA}"
          docker buildx imagetools inspect --raw "${GHCR_IMAGE}:sha-${GITHUB_SHA}" > "$RUNNER_TEMP/edge-expected.json"
          docker buildx imagetools inspect --raw "${GHCR_IMAGE}:edge" > "$RUNNER_TEMP/edge-published.json"
          cmp "$RUNNER_TEMP/edge-expected.json" "$RUNNER_TEMP/edge-published.json"
          jq -e '[.manifests[].platform | .os + "/" + .architecture] | sort == ["linux/amd64", "linux/arm64"]' \
            "$RUNNER_TEMP/edge-published.json"
          docker buildx imagetools inspect "${GHCR_IMAGE}:edge"
          {
            echo '### Published transition image'
            echo "- ${GHCR_IMAGE}:edge"
            echo "- ${GHCR_IMAGE}:sha-${GITHUB_SHA}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo '- Both platforms passed migration tests and runtime verification before publication.'
          } >> "$GITHUB_STEP_SUMMARY"
