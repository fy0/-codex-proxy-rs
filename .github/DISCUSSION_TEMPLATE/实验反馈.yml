body:
  - type: markdown
    attributes:
      value: |
        欢迎分享实验版本的使用体验，包括有效、无明显变化或遇到限制的情况。
        请先查看对应[预发行页面](https://github.com/zyycn/codex-proxy-rs/releases)的部署与数据隔离说明，并搜索已有反馈。
        明确的程序缺陷请使用 [Issue 模板](https://github.com/zyycn/codex-proxy-rs/issues/new/choose)，在两处互相附链接即可，无需重复粘贴。
        请移除密钥、令牌、Cookie、代理认证和私人内容，不要上传完整配置或请求转储。

  - type: input
    id: version
    attributes:
      label: 实验版本或提交号
      description: 填写实际运行的完整版本号或提交号，不要只写 exp 或 latest。
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与环境
      description: 说明启用的实验功能、部署方式、客户端及与结果相关的条件，不需要提供账号身份信息。
    validations:
      required: true

  - type: textarea
    id: observation
    attributes:
      label: 观察到的效果或限制
      description: 描述实际现象、出现频率和观察时长；请区分观察结果与原因推测。
    validations:
      required: true

  - type: textarea
    id: comparison
    attributes:
      label: 对照与复现信息
      description: 如已对比启用前后或不同配置，请说明条件和结果；没有对照也可以反馈，无需额外测试。

  - type: textarea
    id: references
    attributes:
      label: 相关链接与补充材料
      description: 可附已有 Issue、讨论、脱敏日志片段或截图。
